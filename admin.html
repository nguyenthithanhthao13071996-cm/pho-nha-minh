<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị Phố Chipi</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="chipi-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--ink:#2B2B2B;--ink2:#666;--bg:#FFF7E8;--card:#fff;--line:#2B2B2B;--accent:#EE4D2D;--ok:#16A34A;--soft:#FFF1D6;--blue:#2563EB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#FF9A5C,#FFB26B);border-bottom:3px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.logo{display:flex;align-items:center;gap:8px;font:800 19px/1 "Baloo 2",system-ui;color:var(--ink);text-decoration:none}
.logo img{width:36px;height:36px;object-fit:contain}
.top .sp{flex:1}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{margin:0 0 6px;font:800 21px/1.2 "Baloo 2",system-ui}
.muted{color:var(--ink2)}
.small{font-size:13px}
.btn{border:3px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;background:#fff;min-height:44px}
.btn.pri{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{border-width:2px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;min-height:44px}
textarea{min-height:70px}
label.f{display:grid;gap:4px;font-weight:800;font-size:14px}
label.f small{font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--ink);color:#fff;border-radius:14px;padding:12px}
.kpi span{display:block;font-size:12px;color:#ddd}
.kpi b{font:800 26px/1.1 "Baloo 2",system-ui;color:#FFD571}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:8px;border-radius:4px;background:var(--blue)}
.bar b{width:34px;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;min-height:38px}
.chip[aria-pressed=true]{background:#FFD571}
.items{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
.it .acts{display:flex;gap:6px;align-items:center;flex:none}
@media (max-width:540px){.it{flex-wrap:wrap}.it .bd{flex-basis:calc(100% - 70px)}.it .acts{width:100%;justify-content:flex-end;border-top:1px dashed #ccc;padding-top:6px}}
html,body{overflow-x:hidden}
.it{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}
.it .th{width:54px;height:54px;flex:none;border-radius:10px;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-size:28px;overflow:hidden}
.it .th img{width:100%;height:100%;object-fit:contain}
.it .bd{flex:1;min-width:0}
.it .bd b{display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .bd span{font-size:13px;color:var(--ink2)}
.it .pr{color:var(--accent);font-weight:800}
.warn{color:#B45309;font-weight:800}
.tog{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;white-space:nowrap}
.tog input{width:20px;height:20px}
.ic{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;flex:none}
.savebar{position:sticky;bottom:0;z-index:15;background:var(--ink);color:#fff;border-radius:16px 16px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;margin-top:14px}
.savebar span{flex:1;font-weight:800;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow:auto;border:3px solid var(--line);border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0;font:800 21px/1.2 "Baloo 2",system-ui}
.sheet form{display:grid;gap:10px;margin-top:10px}
.prev{width:84px;height:84px;border:2px solid var(--line);border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:40px;overflow:hidden;flex:none}
.prev img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
.err{color:#DC2626;font-weight:800;font-size:13px;min-height:18px;margin:0}
.center{min-height:70dvh;display:grid;place-items:center}
.login{width:min(420px,100%);text-align:center}
.login img{width:110px}
ol.steps{padding-left:20px}
ol.steps li{margin:6px 0}
code{background:var(--soft);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./"><img src="chipi-icon.png" alt=""><span>Quản trị Phố Chipi</span></a>
  <span class="sp"></span>
  <a class="pill" href="./" target="_blank" rel="noopener">Xem web ↗</a>
  <button class="pill dark" id="logout" hidden>Thoát</button>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
